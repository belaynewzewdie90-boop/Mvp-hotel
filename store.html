<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Store Dashboard | Grand Plaza</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/store.css" />
    <link rel="stylesheet" href="css/responsive.css" />
  </head>
  <body>
    <div class="dashboard-shell">
      <aside class="sidebar">
        <div class="sidebar-brand">
          <div class="brand-mark">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
          </div>
          <div>
            <h1>Grand Plaza</h1>
            <small>Store &amp; Inventory</small>
          </div>
        </div>
        <nav>
          <a href="admin.html">Admin</a>
          <a href="kitchen.html">Kitchen</a>
          <a class="active" href="store.html">Store</a>
          <a href="index.html">Customer Menu</a>
        </nav>
        <div class="sidebar-foot">
          <a class="btn btn-ghost" href="index.html">← Back to site</a>
        </div>
      </aside>

      <main class="dashboard-content">
        <div>
          <h1 class="page-title">Store Inventory</h1>
          <p class="page-sub">Track stock levels and reorder on time</p>
        </div>

        <div id="lowStockAlert" class="alert-banner hidden"></div>

        <section class="panel">
          <div class="panel-head">
            <h2>Inventory</h2>
          </div>
          <form id="inventoryForm" class="stack-form">
            <input id="inventoryName" class="input" placeholder="Item name" required />
            <input id="inventoryQty" class="input" type="number" min="1" placeholder="Quantity" required />
            <button type="submit" class="btn btn-primary">Add Item</button>
          </form>
          <div id="inventoryGrid" class="inventory-grid"></div>
        </section>

        <section class="panel">
          <div class="panel-head">
            <h2>Consumption History</h2>
            <span id="consumeCount" class="muted"></span>
          </div>
          <div id="consumeList" class="list"></div>
        </section>
      </main>
    </div>

    <script src="js/database.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/store/inventory.js"></script>
    <script src="js/store/consumptionHistory.js"></script>
  </body>
</html>
