<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Staff Login | Grand Plaza</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/responsive.css" />
  </head>
  <body class="auth-page">
    <div class="auth-card">
      <div class="brand-mark">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      </div>
      <h1>Staff Login</h1>
      <p class="sub">Sign in to access the management dashboards.</p>

      <div id="loginMessage" class="form-error hidden"></div>

      <form id="loginForm" class="stack-form" novalidate>
        <label style="width:100%;display:block">
          <span class="field-label">Username</span>
          <input id="username" class="input" placeholder="e.g. admin" autocomplete="username" required style="width:100%" />
        </label>
        <label style="width:100%;display:block">
          <span class="field-label">Password</span>
          <div style="position:relative">
            <input id="password" class="input" type="password" placeholder="••••••••" autocomplete="current-password" required style="width:100%;padding-right:44px" />
            <button type="button" id="togglePass" class="btn btn-ghost" aria-label="Show password"
              style="position:absolute;right:6px;top:50%;transform:translateY(-50%);padding:6px;border-radius:8px"></button>
          </div>
        </label>
        <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
          Sign in
        </button>
      </form>

      <div class="auth-hint">
        <strong>Demo credentials</strong><br />
        Admin — <code>admin</code> / <code>admin123</code><br />
        Kitchen — <code>kitchen</code> / <code>kitchen123</code>
      </div>

      <p class="muted" style="text-align:center;margin-top:16px">
        <a href="index.html">← Back to customer menu</a>
      </p>
    </div>

    <script src="js/database.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/login.js"></script>
  </body>
</html>
